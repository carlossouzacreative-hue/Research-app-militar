<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel do moderador</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; color: #172030; background: #f2f2f2; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
    th { background: #fafafa; font-weight: 600; }
    .st { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e5e5e5; }
    .st.Ok { background: #d6f0dc; }
    .st.Em { background: #fff1c2; }
    .st.Com, .st.Aband { background: #fbd9d9; }
    .box { background: #fff; border-radius: 8px; padding: 12px; margin-top: 16px; }
    select, input, button { font: inherit; padding: 8px 10px; margin: 4px 4px 4px 0; border-radius: 8px; border: 1px solid #c9c9c9; }
    button { cursor: pointer; background: #172030; color: #fff; border-color: #172030; }
    button.sec { background: #fff; color: #172030; }
    .msg { font-size: 13px; color: #576175; margin-left: 4px; }
  </style>
</head>
<body>
  <h1>Painel do moderador</h1>
  <table>
    <thead><tr><th>Participante</th><th>Agora</th><th>Ordem</th><th>Cenário A</th><th>Cenário B</th><th>Liberar</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6">Carregando…</td></tr></tbody>
  </table>

  <div class="box">
    <strong>Marcar durante a sessão</strong><br>
    <select id="p"></select>
    <select id="sc"><option>A</option><option>B</option></select>
    <button data-flag="ajuda">Com ajuda</button>
    <button data-flag="abandonou">Abandonou</button>
    <br>
    <input id="nm" placeholder="Nome como a pessoa quer ver" size="26" maxlength="40">
    <button class="sec" id="setnm">Definir nome no app</button>
    <small class="msg">Só com o OK da pessoa. Pode ser só o primeiro nome ou o nome completo, do jeito que ela quiser ver. Nunca CPF ou dados de documento. Não vai para o log. Vazio = persona Rafael.</small>
    <br>
    <input id="note" placeholder="Nota rápida (opcional)" size="32">
    <button class="sec" data-flag="nota">Salvar nota</button>
    <span class="msg" id="msg"></span>
  </div>

  <script src="tasks.js"></script>
  <script>
    var T = new URLSearchParams(location.search).get('t') || '';
    var rows = document.getElementById('rows');
    var sel = document.getElementById('p');
    var msg = document.getElementById('msg');
    function cls(s) { return String(s || '').split(' ')[0]; }
    function render(data) {
      var ids = Object.keys(data);
      rows.innerHTML = ids.map(function (id) {
        var r = data[id];
        var g = r.gate || {};
        var wait = g.online && /Aguardando liberar/.test(g.label || '') && g.released <= g.g;
        var tid = ((g.label || '').match(/Aguardando liberar (.+)/) || [])[1];
        var ttxt = '';
        Object.keys(window.TASKS || {}).forEach(function (k) { window.TASKS[k].forEach(function (t) { if (t.id === tid) ttxt = t.texto; }); });
        var apOk = g.px === 'open' && /Fazendo B2/.test(g.label || '');
        var now = !g.online ? '<span style="color:#949ba8">offline</span>' : '<span style="color:#1a7f37">● no site</span> · ' + (g.label || '') + (wait && ttxt ? '<br><small>Ler: \u201c' + ttxt + '\u201d</small>' : '');
        return '<tr' + (wait ? ' style="background:#fff7e0"' : '') + '><td>' + id + '</td><td>' + now + '</td><td>' + (r.ordem || '') + '</td>' +
          '<td><span class="st ' + cls(r.A) + '">' + r.A + '</span></td>' +
          '<td><span class="st ' + cls(r.B) + '">' + r.B + '</span></td>' +
          '<td>' + (wait ? '<button data-rel="' + id + '">Liberar ' + tid + '</button>' : '<button class="sec" disabled style="opacity:.5;cursor:default">Nada para liberar</button>') + '<br>' + (g.payRecv ? '<small style="color:#1a7f37">Pagamento aprovado ' + g.payRecv + 'x ✓</small><br>' : '') + '<button class="sec" data-appr="' + id + '"' + (apOk ? ' style="margin-top:4px"' : ' disabled style="margin-top:4px;opacity:.5;cursor:default"') + '>1. Aprovar pagamento</button>' + (apOk ? '' : '<br><small style="color:#949ba8">só na B2, com o Pix aberto na tela (na B1 ele expira de propósito). A emissão libera sozinha ~4 s depois.</small>') + '<br><button class="sec" data-skip="' + id + '" style="margin-top:4px;font-size:12px;padding:3px 8px">Encerrar tarefa</button>' + '<br><small>Reiniciar: ' + ['A', 'B', 'all'].map(function (k) { return '<button class="sec" style="color:#b3261e;border-color:#b3261e;padding:3px 8px;font-size:12px" data-zer="' + id + '" data-sc="' + k + '">' + (k === 'all' ? 'tudo' : 'só ' + k) + '</button>'; }).join('') + '</small></td></tr>';
      }).join('');
      if (sel.options.length !== ids.length) {
        sel.innerHTML = ids.map(function (id) { return '<option>' + id + '</option>'; }).join('');
      }
    }
    function load() {
      fetch('/api/status?t=' + encodeURIComponent(T), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(render)
        .catch(function () { rows.innerHTML = '<tr><td colspan="6">Token inválido. Use o link completo do painel.</td></tr>'; });
    }
    rows.addEventListener('click', function (e) {
      var rel = e.target.getAttribute('data-rel'), zer = e.target.getAttribute('data-zer'), pay = e.target.getAttribute('data-pay'), appr = e.target.getAttribute('data-appr'), skp = e.target.getAttribute('data-skip');
      if (!rel && !zer && !pay && !appr && !skp) return;
      var sc = e.target.getAttribute('data-sc');
      if (zer) {
        var what = sc === 'all' ? 'TODO o teste' : 'o cenário ' + sc;
        var ans = prompt('Reiniciar ' + what + ' de ' + zer + '?\nA pessoa volta ao começo e o status vira Pendente. O log antigo fica guardado em data/arquivo.\n\nDigite ' + zer + ' para confirmar:');
        if (ans === null || ans.trim().toUpperCase() !== zer.toUpperCase()) { msg.textContent = 'Reinício cancelado'; return; }
      }
      fetch('/api/gate?t=' + encodeURIComponent(T), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: rel || zer || pay || appr || skp, action: skp ? 'skip' : appr ? 'approve' : pay ? 'confirm' : rel ? 'release' : 'restart', scope: sc }) })
        .then(function () { msg.textContent = skp ? 'Tarefa encerrada: ' + skp : appr ? 'Pagamento aprovado: ' + appr : pay ? 'Emissão liberada: ' + pay : rel ? 'Liberado: ' + rel : 'Reiniciado (' + sc + '): ' + zer; load(); });
    });
    document.querySelectorAll('[data-flag]').forEach(function (b) {
      b.addEventListener('click', function () {
        var flag = b.getAttribute('data-flag');
        var body = { p: sel.value, scenario: document.getElementById('sc').value, flag: flag, note: document.getElementById('note').value };
        if (flag === 'abandonou') body.status = 'Abandonou';
        if (flag === 'ajuda') body.status = 'Com ajuda';
        fetch('/api/mod?t=' + encodeURIComponent(T), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { msg.textContent = r.ok ? 'Salvo' : 'Erro ao salvar'; document.getElementById('note').value = ''; load(); })
          .catch(function () { msg.textContent = 'Erro ao salvar'; });
      });
    });
    document.getElementById('setnm').addEventListener('click', function () {
      fetch('/api/gate?t=' + encodeURIComponent(T), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: sel.value, action: 'nome', nome: document.getElementById('nm').value }) })
        .then(function (r) { msg.textContent = r.ok ? 'Nome definido para ' + sel.value : 'Erro ao salvar o nome'; });
    });
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
