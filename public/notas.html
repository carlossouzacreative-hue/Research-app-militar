<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Roteiro e anotações</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 0; color: #172030; background: #f2f2f2; }
    .wrap { display: flex; align-items: flex-start; gap: 16px; padding: 16px; }
    .main { flex: 1 1 0; min-width: 0; order: 2; zoom: 1.1; }
    .side { flex: 0 0 600px; order: 1; position: sticky; top: 0; height: 100vh; margin: -16px 0 -16px -16px; }
    .side iframe { width: 100%; height: 100%; border: 0; border-right: 1px solid #d0d0d0; background: #f2f2f2; }
    @media (max-width: 1100px) { .main { zoom: 1; } .wrap { display: block; } .side { position: static; height: 560px; margin: 16px 0 0; } .side iframe { border: 1px solid #d0d0d0; border-radius: 10px; } }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    select, input, textarea, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #c9c9c9; background: #fff; color: #172030; }
    textarea { width: 100%; min-height: 56px; resize: vertical; }
    input[type=text] { width: 100%; }
    .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 2px solid transparent; }
    .card.now { border-color: #172030; }
    .card h3 { font-size: 15px; margin: 0 0 2px; }
    .mis { font-size: 13px; color: #576175; margin-bottom: 8px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e5e5e5; margin-left: 6px; font-weight: 400; }
    .badge.on { background: #172030; color: #fff; }
    .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .lab { font-size: 12px; color: #576175; min-width: 70px; }
    .seg button { padding: 6px 10px; margin: 0; border-radius: 0; border-right-width: 0; cursor: pointer; }
    .seg button:first-child { border-radius: 8px 0 0 8px; }
    .seg button:last-child { border-radius: 0 8px 8px 0; border-right-width: 1px; }
    .seg button.on { background: #172030; color: #fff; border-color: #172030; }
    .sc { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #576175; margin: 18px 0 6px; text-transform: uppercase; }
    .sm { font-size: 12px; color: #576175; }
    .saved { font-size: 13px; color: #1a7f37; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    label { font-size: 12px; color: #576175; display: block; margin: 4px 0 2px; }
    .cnt button { padding: 4px 12px; cursor: pointer; }
    .read { border-left: 5px solid #172030; background: #eef1f6; padding: 14px 18px; margin: 8px 0 14px; border-radius: 0 10px 10px 0; font-size: 24px; line-height: 1.55; }
    .read b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #576175; margin-bottom: 2px; }
    .do { font-size: 13px; margin: 4px 0; color: #172030; }
    .do span { color: #576175; }
    details { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    summary { cursor: pointer; font-weight: 600; font-size: 15px; }
    details ul { margin: 8px 0 0; padding-left: 4px; list-style: none; }
    details li { margin: 6px 0; font-size: 13px; line-height: 1.4; }
    details li label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #172030; margin: 0; }
    details li input { margin-top: 2px; padding: 0; }
    .step { font-size: 12px; color: #576175; margin: 8px 0 2px; }
    .pause { background: #fff8e1; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
    .top { position: sticky; top: 0; background: #f2f2f2; padding: 8px 0; z-index: 5; }
    h2 { border-top: 1px solid #d8d8d8; padding-top: 14px; }
    code { background: #e9e9e9; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .q { font-size: 22px; font-weight: 600; margin: 16px 0 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap"><div class="main">
  <h1>Roteiro e anotações</h1>
  <div class="top">
    <select id="p"></select>
    <span id="pres" class="sm"></span>
    <span id="sv" class="saved"></span>
  </div>
  <div id="doc"></div>
  </div>
  <div class="side"><iframe id="mod" title="Painel do moderador"></iframe></div></div>

  <script src="tasks.js"></script>
  <script>
    var T = new URLSearchParams(location.search).get('t') || '';
    var $ = function (i) { return document.getElementById(i); };
    function setMod(p) { $('mod').src = 'mod.html?embed=1&t=' + encodeURIComponent(T) + '&only=' + encodeURIComponent(p || ''); }
    var sel = $('p'), doc = $('doc'), sv = $('sv');
    var D = {}, cur = '', ST = {}, timer = null;

    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

    function save() {
      clearTimeout(timer); sv.textContent = 'salvando…';
      timer = setTimeout(function () {
        fetch('/api/notas?t=' + encodeURIComponent(T), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: cur, data: D }) })
          .then(function (r) { sv.textContent = r.ok ? 'salvo ✓' : 'erro ao salvar'; })
          .catch(function () { sv.textContent = 'erro ao salvar'; });
      }, 500);
    }
    function setD(path, v) {
      var o = D;
      for (var i = 0; i < path.length - 1; i++) { o = o[path[i]] = o[path[i]] || {}; }
      o[path[path.length - 1]] = v; save();
    }
    function getD(path) {
      var o = D;
      for (var i = 0; i < path.length; i++) { if (o == null) return ''; o = o[path[i]]; }
      return o == null ? '' : o;
    }
    function field(label, path, multi, ph) {
      var w = el('div'); w.appendChild(el('label', '', label));
      var f = el(multi ? 'textarea' : 'input'); if (!multi) f.type = 'text'; if (ph) f.placeholder = ph;
      f.value = getD(path); f.addEventListener('input', function () { setD(path, f.value); });
      w.appendChild(f); return w;
    }
    function seg(label, path, opts, title) {
      var r = el('div', 'row'); r.appendChild(el('span', 'lab', label));
      var g = el('div', 'seg'), btns = [];
      opts.forEach(function (o) {
        var b = el('button', '', o); b.type = 'button'; if (title && title[o]) b.title = title[o];
        if (String(getD(path)) === o) b.className = 'on';
        b.addEventListener('click', function () {
          var on = String(getD(path)) === o; setD(path, on ? '' : o);
          btns.forEach(function (x) { x.className = ''; }); if (!on) b.className = 'on';
        });
        btns.push(b); g.appendChild(b);
      });
      r.appendChild(g); return r;
    }
    function counter(label, path) {
      var r = el('div', 'row cnt'); r.appendChild(el('span', 'lab', label));
      var m = el('button', '', '−'), n = el('strong', '', String(getD(path) || 0)), pl = el('button', '', '+');
      m.type = pl.type = 'button';
      m.addEventListener('click', function () { var v = Math.max(0, (+getD(path) || 0) - 1); setD(path, v); n.textContent = v; });
      pl.addEventListener('click', function () { var v = (+getD(path) || 0) + 1; setD(path, v); n.textContent = v; });
      r.appendChild(m); r.appendChild(n); r.appendChild(pl); return r;
    }

    var META = {
      A1: { ok: 'O agendamento é confirmado na tela de sucesso.', faz: 'Nada: não diga onde clicar.' },
      A2: { ok: 'Encontra data e horário do agendamento.', faz: 'Nada.' },
      B1: { ok: 'Gera o Pix e vê o Pix expirar sozinho (10 segundos, de propósito) e entende o que aconteceu. Só depois do "Terminei" o app explica que foi de propósito (botão libera em 5 segundos).', faz: 'Nada: não explique. Antes da nota, pergunte: "O que aconteceu com o Pix? Você foi cobrado?" e anote a resposta literal.' },
      B2: { ok: 'Gera outro Pix e, depois da sua aprovação, vê "Pagamento recebido".', faz: 'Observe o primeiro toque depois de começar: como ela chega a "Gerar novo Pix" (recuperação). Quando ela disser que pagou, toque em "Aprovar pagamento" (só liga com o Pix aberto na tela). Não ajude a achar o Pix: ela deve ir em Documentos.' },
      B3: { ok: 'O card muda sozinho para disponível, ela emite o CDI e chega em "Concluído".', faz: 'Nada a liberar: observe se ela percebe a mudança sem você falar. Antes da nota, pergunte: "O que você entendeu da etiqueta do pagamento? O que esperava que acontecesse?"' },
      B4: { ok: 'Chega à tela Pagamentos (Perfil).', faz: 'Nada: não diga onde fica.' }
    };
    var ANTES = [
      'Na pasta do projeto: <code>Set-ExecutionPolicy -Scope Process Bypass</code> e depois <code>.\\scripts\\iniciar.ps1</code>. Deixe a janela aberta até o fim.',
      'Pasta <code>data\\sessions</code> vazia e status "Pendente" (<code>.\\scripts\\status.ps1</code>). Teste só em <code>?p=TESTE&amp;reset=1</code>, nunca em P1 a P6.',
      'Painel do moderador aberto (<code>mod.html?t=TOKEN</code>, token em <code>data\\token.txt</code>) e esta tela de Anotações.',
      'Mande à pessoa só o link dela (<code>?p=P1</code>…P6), depois de subir o <code>iniciar.ps1</code>.',
      'Google Meet: peça que ela compartilhe a aba do navegador com o áudio. Se o Meet não gravar, use Win+Alt+R.',
      'Se for no celular: "Adicionar à tela inicial" e abrir pelo ícone, para tela cheia.'
    ];
    var REGRAS = [
      'Não ajude nem explique a tela. Se ela perguntar "posso clicar aqui?", responda "o que você esperaria que acontecesse?".',
      'Leia as missões sempre com as mesmas palavras.',
      'Se algo não responder, lembre que o teste é limitado e peça que diga o que esperava.',
      'Deixe a pessoa livre para explorar e tentar a missão do jeito que preferir. Registre os caminhos inesperados.',
      'Escada de ajuda: (1) "O que você está tentando fazer?" (2) "Onde você esperaria encontrar isso?" (3) dica direta, marcada como "Com ajuda". Os degraus 1 e 2 não contam como ajuda. Tempo máximo de 5 minutos por tarefa.',
      'Amigos tendem a ser gentis demais: peça críticas abertamente.'
    ];
    var ABERTURA = 'Esse é um app fictício, um protótipo de média fidelidade usado apenas para fins acadêmicos, e o teste é limitado, somente algumas partes funcionam. Se clicar em algo que não funciona, apenas me diga em voz alta o que você esperava que acontecesse. Sinta-se livre para explorar e você pode parar o teste quando quiser. Um contexto rápido: o CDI é o Certificado de Dispensa de Incorporação, o documento que comprova que a pessoa foi dispensada do serviço militar obrigatório, e nas missões você vai usar o app para emiti-lo. Algumas missões têm etapas de pagamento por Pix, mas são apenas ilustrativas, não precisa se preocupar, nada é cobrado de verdade. Eu só preciso que leia as instruções com calma e faça algumas missões, o app vai te instruir. Não precisa ter pressa ou medo de errar, a avaliação é do app e não de você. Se tiver algo que você não gostou ou achou confuso, preciso que me fale. Ao terminar a missão, o app mostra um botão para avançar para a próxima etapa. O teste é dividido em duas etapas, cenário A e cenário B, e pode parecer confuso porque ele vai pedir para fazer a mesma ação mais de uma vez, mas é normal. Depois de cada missão eu vou te perguntar uma nota de 1 a 7 para o quanto foi fácil, sendo 1 muito difícil e 7 muito fácil, então já pode ir pensando nisso. Vou gravar a tela apenas para análise das respostas e ações, tudo bem?';
    var CONSENT = 'Antes de começar, preciso do seu ok para algumas coisas. Vou gravar a tela e o áudio da nossa chamada, e o aplicativo também registra seus toques e o tempo em cada tela. Isso é só para eu analisar o teste e melhorar o projeto. Só eu vou ter acesso às gravações, e vou apagá-las depois da análise. No meu projeto você aparece só como P e um número, sem nome. Nada com a sua imagem ou a sua voz será publicado sem a sua permissão específica. Você pode parar o teste quando quiser e pedir para eu apagar o que gravei. Está combinado? Pode dizer "sim, concordo".';
    var AQUEC = 'Enquanto usa o app, vá falando em voz alta o que está vendo, pensando e esperando que aconteça. Pode treinar agora: me conte o que você vê nesta tela.';
    var ENCERRA = 'Muito obrigado, de verdade! Lembrando que o teste foi limitado: só algumas partes do app existiam, e o de verdade tem muito mais. Tudo que você fez e falou vai me ajudar demais a melhorar a emissão de documentos. Posso parar a gravação?';

    function readBox(titulo, txt) { var r = el('div', 'read'); r.appendChild(el('b', '', titulo)); r.appendChild(document.createTextNode(txt)); return r; }
    function chk(label, path, html) {
      var li = el('li'), l = el('label'), i = el('input'); i.type = 'checkbox'; i.checked = !!getD(path);
      i.addEventListener('change', function () { setD(path, i.checked ? 1 : ''); });
      var sp = el('span'); if (html) sp.innerHTML = label; else sp.textContent = label;
      l.appendChild(i); l.appendChild(sp); li.appendChild(l); return li;
    }
    function listBox(titulo, items, key, open) {
      var d = el('details'); if (open) d.open = true; d.appendChild(el('summary', '', titulo));
      var ul = el('ul'); items.forEach(function (t, i) { ul.appendChild(chk(t, ['checks', key, String(i)], true)); });
      d.appendChild(ul); return d;
    }

    function build() {
      doc.innerHTML = '';
      var rec = ST[cur] || {}, ordem = String(rec.ordem || 'AB').toUpperCase() === 'BA' ? ['B', 'A'] : ['A', 'B'];

      doc.appendChild(listBox('1. Antes de chamar a pessoa', ANTES, 'antes', false));

      doc.appendChild(el('h2', '', '2. Abertura'));
      doc.appendChild(readBox('Leia em voz alta', ABERTURA));
      doc.appendChild(readBox('Consentimento: leia antes de gravar', CONSENT));
      var ok = el('details'); ok.open = true; var ul0 = el('ul'); ul0.appendChild(chk('A pessoa disse "sim, concordo" e só então comecei a gravar', ['checks', 'rec', '0'])); ok.appendChild(el('summary', '', 'Gravação')); ok.appendChild(ul0); doc.appendChild(ok);

      doc.appendChild(el('h2', '', '3. Perguntas iniciais'));
      doc.appendChild(el('div', 'sm', 'Leia: "Aqui vão algumas perguntas importantes:"'));
      var pf = el('div', 'card');
      pf.appendChild(el('div', 'q', 'Quantos anos você tem e qual dispositivo está usando?'));
      var g = el('div', 'grid');
      g.appendChild(field('Idade', ['perfil', 'idade'], false));
      g.appendChild(field('Dispositivo', ['perfil', 'dispositivo'], false));
      pf.appendChild(g);
      pf.appendChild(el('div', 'q', 'Já usou algum aplicativo do governo? Se sim, qual?'));
      pf.appendChild(field('Resposta', ['perfil', 'appGov'], false));
      pf.appendChild(el('div', 'q', 'Já precisou de algum documento do exército? Como foi?'));
      pf.appendChild(field('Resposta', ['perfil', 'docEx'], true));
      pf.appendChild(el('div', 'q', 'Posso usar o seu nome na exibição do app? Se não quiser, ele mostra um nome genérico; é apenas estético.'));
      pf.appendChild(seg('Aceitou', ['perfil', 'nomeOk'], ['Sim', 'Não']));
      pf.appendChild(el('div', 'sm', 'Se sim: digite o nome em "Definir nome no app" (painel do moderador). Nunca CPF, senha ou dado de documento.'));
      doc.appendChild(pf);
      doc.appendChild(readBox('Aquecimento (30 segundos): leia antes da 1ª tarefa', AQUEC));

      doc.appendChild(el('h2', '', '4. Tarefas'));
      doc.appendChild(el('div', 'sm', 'Para cada tarefa: confira que a pessoa está "no site" e na tarefa certa → leia a missão com as mesmas palavras e toque em "Liberar" → observe sem ajudar → quando o app mostrar "Tarefa concluída", faça a pergunta da nota: "De 1 a 7, o quanto foi fácil?" (1 = muito difícil, 7 = muito fácil) e só depois peça que toque em "Terminei a tarefa". Se ela travar: (1) "O que você está tentando fazer?" (2) "Onde você esperaria encontrar isso?" (3) dica direta e marque "Com ajuda". Máximo de 5 minutos por tarefa; depois disso, ou se desistir, use "Encerrar tarefa" e marque "Não".'));

      ordem.forEach(function (sc, i) {
        doc.appendChild(el('div', 'sc', (i + 1) + 'º cenário: ' + sc));
        doc.appendChild(el('div', 'sm', 'Começa com uma tela de apresentação: o "Entendi" só libera depois de 8 segundos. Não explique nada.'));
        (window.TASKS[sc] || []).forEach(function (t) {
          var m = META[t.id] || {};
          var c = el('div', 'card'); c.setAttribute('data-t', t.id);
          var h = el('h3', '', t.id); var b = el('span', 'badge', ''); b.setAttribute('data-b', t.id); h.appendChild(b); c.appendChild(h);
          c.appendChild(readBox('Leia a missão', t.texto));
          var d1 = el('div', 'do'); d1.innerHTML = '<span>Sucesso quando:</span> '; d1.appendChild(document.createTextNode(m.ok || '')); c.appendChild(d1);
          var d2 = el('div', 'do'); d2.innerHTML = '<span>Você faz:</span> '; d2.appendChild(document.createTextNode(m.faz || '')); c.appendChild(d2);
          c.appendChild(el('div', 'step', 'Anote'));
          c.appendChild(counter('Toques errados', ['tarefas', t.id, 'toques']));
          c.appendChild(field('Frase literal / o que a pessoa disse', ['tarefas', t.id, 'frase'], true));
          c.appendChild(seg('Resultado', ['tarefas', t.id, 'res'], ['Sim', 'Com ajuda', 'Não']));
          c.appendChild(seg('Nota', ['tarefas', t.id, 'nota'], ['1', '2', '3', '4', '5', '6', '7'], { 1: 'muito difícil', 7: 'muito fácil' }));
          c.appendChild(field('O que mudar', ['tarefas', t.id, 'mudar'], false));
          doc.appendChild(c);
        });
        if (i === 0) doc.appendChild(el('div', 'pause', 'Entre os dois cenários o app mostra "Parte concluída": toque em "Liberar" quando ela estiver pronta.'));
      });

      doc.appendChild(el('h2', '', '5. Perguntas finais'));
      var fm = el('div', 'card');
      fm.appendChild(field('Como foi a experiência? O que funcionou bem?', ['fim', 'confuso'], true));
      fm.appendChild(field('O que você esperava ver e não viu? Houve algum momento em que não soube o que fazer?', ['fim', 'esperava'], true));
      fm.appendChild(field('Em uma palavra, como foi a experiência?', ['fim', 'palavra'], false));
      fm.appendChild(field('Tem alguma sugestão ou algo que você mudaria? (anote conforme ela falar)', ['sugestoes'], true));
      doc.appendChild(fm);

      doc.appendChild(el('h2', '', '6. Encerramento'));
      doc.appendChild(el('div', 'sm', 'O app termina com uma tela de agradecimento. Depois, leia:'));
      doc.appendChild(readBox('Leia em voz alta', ENCERRA));
      var e = el('details'); e.open = true; var ul1 = el('ul'); ul1.appendChild(chk('Parei a gravação e salvei o arquivo com o nome do participante', ['checks', 'rec', '1'])); e.appendChild(el('summary', '', 'Gravação')); e.appendChild(ul1); doc.appendChild(e);

      doc.appendChild(listBox('7. Regras durante a sessão', REGRAS, 'regras', false));
      mark();
    }

    // marca a tarefa que a pessoa esta fazendo agora (sem recriar os campos)
    function mark() {
      var g = (ST[cur] || {}).gate || {}, lb = g.label || '', m = lb.match(/(?:Fazendo|Concluiu|Aguardando liberar) ([AB]\d)/), id = m && m[1];
      $('pres').textContent = !g.online ? 'offline' : '● no site · ' + (lb || '');
      Array.prototype.forEach.call(doc.querySelectorAll('.card[data-t]'), function (c) {
        var on = !!id && c.getAttribute('data-t') === id; c.classList.toggle('now', on);
        var b = c.querySelector('[data-b]'); b.textContent = on ? lb : ''; b.className = on ? 'badge on' : 'badge';
      });
    }

    function openP(p) {
      cur = p; sv.textContent = ''; setMod(p);
      fetch('/api/notas?t=' + encodeURIComponent(T) + '&p=' + encodeURIComponent(p), { cache: 'no-store' })
        .then(function (r) { return r.json(); }).then(function (d) { D = d || {}; build(); });
    }
    function poll() {
      fetch('/api/status?t=' + encodeURIComponent(T), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (s) {
        ST = s;
        if (!sel.options.length) {
          Object.keys(s).forEach(function (k) { var o = el('option', '', k); sel.appendChild(o); });
          if (sel.options.length) openP(sel.value);
        } else mark();
      }).catch(function () { $('pres').textContent = 'Token inválido. Use o link completo.'; });
    }
    sel.addEventListener('change', function () { openP(sel.value); });
    poll(); setInterval(poll, 3000);
  </script>
</body>
</html>
